spring.config.import=optional:file:.env.local[.properties],optional:file:.env[.properties],optional:file:../.env.local[.properties],optional:file:../.env[.properties]
server.port=${PORT:8081}
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.idle-timeout=30000
spring.jpa.properties.hibernate.default_schema=dbo

app.security.jwt.secret=${JWT_SECRET}

spring.flyway.locations=classpath:db/postgresql
spring.flyway.schemas=dbo
spring.flyway.baseline-on-migrate=false

spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

logging.level.root=WARN
logging.level.com.jobradar=INFO

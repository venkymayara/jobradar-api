spring.application.name=jobradar-api
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.log-request-details=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8081}
#server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ven_db;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.security.jwt.issuer=jobradar-api
app.security.jwt.access-token-ttl=PT15M
app.security.refresh-token-ttl=P30D
app.security.refresh-cookie-name=JOBRADAR_REFRESH
app.security.refresh-cookie-same-site=Strict
app.security.refresh-cookie-secure=true

logging.level.root=INFO
logging.level.com.jobradar=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} %kvp - %msg%n

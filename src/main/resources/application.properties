spring.application.name=jobradar-api
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.mvc.log-request-details=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8081}
#server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ven_db;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.security.jwt.issuer=jobradar-api
app.security.jwt.access-token-ttl=PT15M
app.security.refresh-token-ttl=${AUTH_SESSION_TTL:PT8H}
app.security.refresh-cookie-name=JOBRADAR_REFRESH
app.security.refresh-cookie-same-site=Strict
app.security.refresh-cookie-secure=true
app.notifications.email-enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
app.opportunities.expiry-enabled=${OPPORTUNITY_EXPIRY_ENABLED:true}
app.opportunities.expiry-initial-delay-ms=${OPPORTUNITY_EXPIRY_INITIAL_DELAY_MS:60000}
app.opportunities.expiry-scan-interval-ms=${OPPORTUNITY_EXPIRY_SCAN_INTERVAL_MS:3600000}
app.external-jobs.remotive.enabled=${EXTERNAL_JOBS_REMOTIVE_ENABLED:false}
app.external-jobs.initial-delay-ms=${EXTERNAL_JOBS_INITIAL_DELAY_MS:60000}
app.external-jobs.refresh-interval-ms=${EXTERNAL_JOBS_REFRESH_INTERVAL_MS:21600000}

logging.level.root=INFO
logging.level.com.jobradar=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} %kvp - %msg%n

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ven_db;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Existing ven_db objects are baselined at version 0 so the future V1 migration can run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.hibernate.SQL=INFO
app.security.jwt.secret=${JWT_SECRET:local-development-secret-change-me-please-32-bytes-minimum}
app.security.refresh-cookie-secure=false
